# Example coturn configuration (TURN relay for the emulator WebRTC stream).
# Credentials must match TURN in ../.env

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
user=turnuser:CHANGE_THIS_TURN_PASSWORD
realm=turn.example.org
server-name=turn.example.org

# Public IP of the runtime host (required when the host is behind NAT)
# external-ip=<public-ip>

# Relay port range
min-port=49152
max-port=65535

# TLS (optional; same certificate as envoy)
# cert=/etc/coturn/certs/certificate.pem
# pkey=/etc/coturn/certs/privkey.pem

no-cli
no-multicast-peers
log-file=stdout
