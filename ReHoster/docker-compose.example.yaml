# Runtime services for the emulator experiments (DNS/blocklists, interception, gRPC-web proxy, TURN).
# The emulator containers themselves are started on demand by consumer.py / docker_spawn.py and
# attached to the networks defined below (project_frontend, project_android).
#
# Setup:  ./env.example/init_env.sh <host name>   (creates env/ and docker-compose.yaml from this file)
#         docker compose up -d
# "example.org" is replaced by init_env.sh with your host name.

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./env/nginx/public:/usr/share/nginx/html
      - ./env/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./env/nginx/app.conf:/etc/nginx/conf.d/default.conf
      - ./env/nginx/ssl/live:/etc/letsencrypt/live
    ports:
      - "80:80"
      - "8443:443"
    networks:
      - frontend

  envoy:                                   # gRPC-web proxy to the emulators (routes in env/envoy/envoy.yaml)
    platform: linux/arm64
    container_name: envoy
    image: envoyproxy/envoy:v1.27-latest
    restart: unless-stopped
    command: /docker-entrypoint-initdb.d/init_envoy.sh
    volumes:
      - ./env/envoy/init_envoy.sh:/docker-entrypoint-initdb.d/init_envoy.sh
      - ./env/envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ./env/envoy/example.org/:/etc/envoy/certs/
      - ./public/.well-known/:/var/www/certbot/.well-known/
    ports:
      - "443:443"
    networks:
      - frontend

  pihole:                                  # DNS resolver of all emulators (dns: 172.31.250.2); loads the blocklists
    image: pihole/pihole:latest
    container_name: pihole
    env_file:
      - ./env/pihole/.env
    ports:
      - "8083:443"
    expose:
      - "53/tcp"
      - "53/udp"
    volumes:
      - './pihole-data:/etc/pihole'        # gravity.db and pihole-FTL.db are written here
    networks:
      android:
        ipv4_address: 172.31.250.2
    restart: unless-stopped

  mitmproxy:                               # traffic interception; CA cert in toolbox/ca_certificates/
    container_name: mitmproxy
    image: mitmproxy/mitmproxy
    ports:
      - "8081:8081"                        # mitmweb UI
      - "8082:8082"                        # regular proxy
      - "8080:8080"                        # transparent proxy
      - "8050:8050"                        # SOCKS5
      - "51821:51821"                      # WireGuard
    dns:
      - 172.31.250.2
    env_file:
      - ./env/mitmproxy/.env
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_nonlocal_bind=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    command: "mitmweb --web-host 0.0.0.0 --mode transparent@8080 --mode socks5@8050 --mode regular@8082 --mode wireguard@51821 --showhost --save-stream-file +/home/mitmproxy/.mitmproxy/flows.mitm"
    volumes:
      - ./env/mitmproxy/config.yml:/home/mitmproxy/.mitmproxy/config.yml
      - ./mitmproxy-data:/home/mitmproxy/.mitmproxy
    networks:
      android:
        ipv4_address: 172.31.250.4
      frontend:

  adb_streamer:                            # optional live view of the emulators (not needed for the measurements)
    profiles: ["streaming"]                # start with: docker compose --profile streaming up -d
    container_name: adb_streamer
    hostname: adb_streamer
    build:
      context: ./adb_streaming_service
      dockerfile: 'Dockerfile'
    ports:
      - '9001:9001'
    restart: always
    env_file:
      - ./env/adb_streamer/.env
    networks:
      android:
        ipv4_address: 172.31.250.3
    volumes:
      - './adb_streaming_service/source/apps:/app/source/apps'
      - ./env/adb_streamer/fmd.cert:/app/source/env/certs/fmd.crt
      - ./env/adb_streamer/fmd.key:/app/source/env/certs/fmd.key

  coturn:                                  # TURN relay for the WebRTC emulator display
    platform: linux/arm64
    container_name: coturn
    image: coturn/coturn
    restart: unless-stopped
    volumes:
      - ./env/coturn/turnserver.conf:/etc/coturn/turnserver.conf
    network_mode: "host"

networks:
  frontend:
    name: project_frontend
    driver: bridge
    attachable: true
  android:
    name: project_android
    driver: bridge
    attachable: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25      # emulators get 172.31.250.130+ (consumer.py)
          gateway: 172.31.250.1
